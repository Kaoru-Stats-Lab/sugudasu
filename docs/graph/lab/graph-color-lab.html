<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Graph Color Lab（公開前）| SUGUDASU</title>
  <link rel="stylesheet" href="../../../assets/sugudasu.css">
  <style>
    .gcl { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .gcl-grid { display: grid; gap: 1rem; grid-template-columns: minmax(260px, 320px) 1fr; }
    @media (max-width: 860px) { .gcl-grid { grid-template-columns: 1fr; } }
    .gcl-panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.85rem 1rem; background: #fff; }
    .gcl-panel h2 { font-size: 0.8rem; font-weight: 700; color: #334155; margin: 0 0 0.65rem; }
    .gcl-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.55rem; }
    .gcl-row label { font-size: 0.75rem; color: #475569; min-width: 4.5rem; }
    .gcl-row input[type="text"] { flex: 1; min-width: 6rem; font-family: ui-monospace, monospace; font-size: 0.8rem; padding: 0.25rem 0.4rem; border: 1px solid #cbd5e1; border-radius: 4px; }
    .gcl-row input[type="color"] { width: 2rem; height: 1.75rem; padding: 0; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; }
    .gcl-cats { display: flex; flex-direction: column; gap: 0.25rem; max-height: 9rem; overflow: auto; font-size: 0.8rem; }
    .gcl-preview { min-height: 360px; overflow: auto; background: #f8fafc; border-radius: 6px; padding: 0.5rem; }
    .gcl-preview svg { max-width: 100%; height: auto; display: block; }
    textarea.gcl-tsv { width: 100%; min-height: 7rem; font-family: ui-monospace, monospace; font-size: 0.75rem; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; }
    .gcl-msg { font-size: 0.8rem; color: #64748b; min-height: 1.2rem; }
    .gcl-msg.is-err { color: #b91c1c; }
    .gcl-note { font-size: 0.75rem; color: #64748b; margin: 0 0 1rem; }
  </style>
</head>
<body class="sg-body antialiased text-slate-800">
  <main class="gcl">
    <h1 class="text-lg font-bold mb-1">Graph Color Lab</h1>
    <p class="gcl-note">公開前ラボ · hub 非掲載 · Color Must（主色 / 強調色 HEX+ピッカー / 強調カテゴリ）。Editor ではない。</p>

    <div class="gcl-grid">
      <aside class="space-y-3">
        <section class="gcl-panel">
          <h2>データ（TSV）</h2>
          <textarea id="gcl-tsv" class="gcl-tsv" spellcheck="false"></textarea>
          <div class="gcl-row" style="margin-top:0.5rem">
            <label for="gcl-intent">Intent</label>
            <select id="gcl-intent" class="text-sm border border-slate-300 rounded px-2 py-1">
              <option value="TREND">TREND</option>
              <option value="RANKING">RANKING</option>
              <option value="COMPARISON">COMPARISON</option>
              <option value="TARGET_VS_ACTUAL">TARGET_VS_ACTUAL</option>
            </select>
          </div>
          <div class="gcl-row" id="gcl-cnd-row" hidden>
            <label for="gcl-cnd">CND-004</label>
            <select id="gcl-cnd" class="text-sm border border-slate-300 rounded px-2 py-1">
              <option value="target_as_line">目標線</option>
              <option value="target_as_marker">Bullet</option>
              <option value="target_as_series">並棒</option>
            </select>
          </div>
        </section>

        <section class="gcl-panel">
          <h2>色ロール（MUST）</h2>
          <div class="gcl-row">
            <label for="gcl-series-hex">主色</label>
            <input type="color" id="gcl-series-pick" value="#1D4ED8" aria-label="主色ピッカー">
            <input type="text" id="gcl-series-hex" value="#1D4ED8" autocomplete="off">
          </div>
          <div class="gcl-row">
            <label for="gcl-accent-hex">強調色</label>
            <input type="color" id="gcl-accent-pick" value="#EA580C" aria-label="強調色ピッカー">
            <input type="text" id="gcl-accent-hex" value="#EA580C" autocomplete="off">
          </div>
          <h2 style="margin-top:0.75rem">強調カテゴリ</h2>
          <div id="gcl-cats" class="gcl-cats"></div>
        </section>

        <section class="gcl-panel">
          <h2>表示</h2>
          <div class="gcl-row">
            <label for="gcl-slot">スロット</label>
            <select id="gcl-slot" class="text-sm border border-slate-300 rounded px-2 py-1">
              <option value="generic">generic</option>
              <option value="half_left" selected>half_left</option>
              <option value="full">full</option>
            </select>
          </div>
          <div class="gcl-row">
            <label><input type="checkbox" id="gcl-values"> 値ラベル</label>
            <label><input type="checkbox" id="gcl-preview-frame"> 半面プレビュー枠</label>
          </div>
          <div class="gcl-row" style="margin-top:0.75rem">
            <button type="button" id="gcl-render" class="sg-btn-primary text-sm">再描画</button>
            <button type="button" id="gcl-copy" class="sg-btn-secondary text-sm">SVGコピー</button>
          </div>
          <p id="gcl-msg" class="gcl-msg" role="status"></p>
        </section>
      </aside>

      <section class="gcl-panel">
        <h2>プレビュー</h2>
        <div id="gcl-out" class="gcl-preview" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { extractObservableFromTsv } from '../../../assets/graph-observable-extractor.js';
    import { createGraphDecisionEngine } from '../../../assets/graph-decision-engine.js';
    import { buildGraphSpec } from '../../../assets/graph-spec-builder.js';
    import { renderGraph, wrapDeckHalfLeftPreview } from '../../../assets/graph-renderer.js';
    import {
      normalizeHex,
      buildPresentationFromSettings,
      listSpecCategories,
    } from '../../../assets/graph-presentation-settings.js';

    const SAMPLE =
      '月\t来場者\n6月\t1000\n7月\t1100\n8月\t1400\n9月\t1300\n10月\t1250\n11月\t1180\n12月\t1600\n';

    const el = {
      tsv: document.getElementById('gcl-tsv'),
      intent: document.getElementById('gcl-intent'),
      cndRow: document.getElementById('gcl-cnd-row'),
      cnd: document.getElementById('gcl-cnd'),
      seriesPick: document.getElementById('gcl-series-pick'),
      seriesHex: document.getElementById('gcl-series-hex'),
      accentPick: document.getElementById('gcl-accent-pick'),
      accentHex: document.getElementById('gcl-accent-hex'),
      cats: document.getElementById('gcl-cats'),
      slot: document.getElementById('gcl-slot'),
      values: document.getElementById('gcl-values'),
      previewFrame: document.getElementById('gcl-preview-frame'),
      render: document.getElementById('gcl-render'),
      copy: document.getElementById('gcl-copy'),
      msg: document.getElementById('gcl-msg'),
      out: document.getElementById('gcl-out'),
    };

    el.tsv.value = SAMPLE;
    let rulesDoc = null;
    let engine = null;
    let lastSvg = '';
    let lastCats = [];

    function setMsg(text, isErr) {
      el.msg.textContent = text || '';
      el.msg.classList.toggle('is-err', Boolean(isErr));
    }

    function syncPickFromHex(hexInput, pickInput) {
      const n = normalizeHex(hexInput.value);
      if (n) {
        hexInput.value = n;
        pickInput.value = n;
      }
    }

    function syncHexFromPick(pickInput, hexInput) {
      hexInput.value = pickInput.value.toUpperCase();
    }

    function selectedAccents() {
      return [...el.cats.querySelectorAll('input[type=checkbox]:checked')].map((c) => c.value);
    }

    function renderCatChecks(cats, preferred = ['12月']) {
      const keep = new Set(selectedAccents());
      preferred.forEach((c) => {
        if (cats.includes(c)) keep.add(c);
      });
      el.cats.innerHTML = cats
        .map((c) => {
          const id = `gcl-cat-${encodeURIComponent(c)}`;
          const checked = keep.has(c) ? 'checked' : '';
          return `<label><input type="checkbox" id="${id}" value="${c.replace(/"/g, '&quot;')}" ${checked}> ${c}</label>`;
        })
        .join('');
      lastCats = cats;
    }

    async function loadRules() {
      const res = await fetch('../GRAPH_RULES.json');
      if (!res.ok) throw new Error('GRAPH_RULES.json を読めません（ローカルサーバで開いてください）');
      rulesDoc = await res.json();
      engine = createGraphDecisionEngine(rulesDoc);
    }

    async function redraw() {
      try {
        if (!engine) await loadRules();
        el.cndRow.hidden = el.intent.value !== 'TARGET_VS_ACTUAL';
        const extracted = extractObservableFromTsv(el.tsv.value);
        const decision = engine.decide({
          observable: extracted.observable,
          intent: el.intent.value,
          measures: extracted.measures,
        });
        const payload = buildGraphSpec(decision, {
          intent: el.intent.value,
          observable: extracted.observable,
          table: extracted.table,
          measures: extracted.measures,
          confirmation_choice_id:
            el.intent.value === 'TARGET_VS_ACTUAL' ? el.cnd.value : null,
          rulesDoc,
        });
        if (!payload.graph_spec) {
          setMsg(`描画不可: ${payload.spec_kind || decision.state}`, true);
          el.out.innerHTML = '';
          lastSvg = '';
          return;
        }
        const cats = listSpecCategories(payload.graph_spec);
        if (cats.join('\0') !== lastCats.join('\0')) renderCatChecks(cats);

        syncPickFromHex(el.seriesHex, el.seriesPick);
        syncPickFromHex(el.accentHex, el.accentPick);

        const presentation = buildPresentationFromSettings({
          series_color: el.seriesHex.value,
          accent_color: el.accentHex.value,
          accent_categories: selectedAccents(),
          show_value_labels: el.values.checked,
        });
        const chart = await renderGraph(payload, {
          format: 'svg',
          deck_slot: el.slot.value,
          presentation,
        });
        if (!chart.ok) {
          setMsg(`Renderer REJECT: ${(chart.reason_codes || []).join(',')}`, true);
          el.out.innerHTML = '';
          lastSvg = '';
          return;
        }
        lastSvg = chart.body;
        if (el.previewFrame.checked) {
          const prev = wrapDeckHalfLeftPreview(chart.body, {
            chartWidth: chart.width,
            chartHeight: chart.height,
          });
          el.out.innerHTML = prev.ok ? prev.body : chart.body;
        } else {
          el.out.innerHTML = chart.body;
        }
        setMsg(`${chart.chart_type} · ${chart.width}×${chart.height}`);
      } catch (err) {
        setMsg(String(err?.message || err), true);
      }
    }

    el.seriesPick.addEventListener('input', () => {
      syncHexFromPick(el.seriesPick, el.seriesHex);
      redraw();
    });
    el.accentPick.addEventListener('input', () => {
      syncHexFromPick(el.accentPick, el.accentHex);
      redraw();
    });
    el.seriesHex.addEventListener('change', () => redraw());
    el.accentHex.addEventListener('change', () => redraw());
    el.intent.addEventListener('change', () => redraw());
    el.cnd.addEventListener('change', () => redraw());
    el.slot.addEventListener('change', () => redraw());
    el.values.addEventListener('change', () => redraw());
    el.previewFrame.addEventListener('change', () => redraw());
    el.cats.addEventListener('change', () => redraw());
    el.render.addEventListener('click', () => redraw());
    el.copy.addEventListener('click', async () => {
      if (!lastSvg) {
        setMsg('先に描画してください', true);
        return;
      }
      try {
        await navigator.clipboard.writeText(lastSvg);
        setMsg('チャートSVGをコピーしました（プレビュー枠は含みません）');
      } catch {
        setMsg('クリップボードに書けませんでした', true);
      }
    });

    redraw();
  </script>
</body>
</html>
